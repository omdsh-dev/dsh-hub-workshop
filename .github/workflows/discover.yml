name: discover

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: hub-topic-discovery
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Read the full public Topic snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run topic:fetch
      - name: Refresh public organization projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh-organization.mjs
      - name: Recheck repository evidence with bounded cache lifetime
        run: npm run topic:audit
      - name: Rebuild discovery projections
        run: npm run topic:apply
      - name: Probe current public manifests against current npm releases
        run: npm run market:refresh
      - name: Validate the exact public refresh
        run: npm run validate
      - name: Commit validated discovery and probe data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.json'
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh marketplace discovery and probes"
          git pull --rebase origin main
          npm run validate
          git diff --exit-code -- '*.json'
          git push origin HEAD:main
      - name: Publish through the signed deployment workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
